<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>浪愛串聯 - 一般使用者</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <!-- ===== 左上角回首頁按鈕 ===== -->
    <div class="back-home-btn">
        <a href="index.html" class="back-home-link">
            ← 回首頁
        </a>
    </div>

    <!-- ===== 功能卡片區（無導航欄、無橫幅） ===== -->
    <section class="feature-section" style="padding-top: 3rem;">
        <div class="container">
            <h2 class="section-title">📋 服務項目</h2>
            <div class="feature-grid">
                <a href="qrcode.html" class="feature-card">
                    <div class="card-icon">❤️</div>
                    <h3>愛心碼抽選</h3>
                    <p>隨機抽選一個愛心碼，一起傳遞愛心</p>
                    <span class="card-badge">立即抽選 →</span>
                </a>
            </div>
        </div>
    </section>

    <!-- ===== 最新消息區 ===== -->
    <section class="news-section">
        <div class="container">
            <h2 class="section-title">📰 最新消息</h2>
            <div class="news-list">
                <div class="news-item">
                    <span class="news-date">2026-08-25</span>
                    <span class="news-tag">認養</span>
                    <p class="news-title">🐕 小黑終於找到家了！感謝認養人的愛心</p>
                </div>
                <div class="news-item">
                    <span class="news-date">2026-08-24</span>
                    <span class="news-tag">救援</span>
                    <p class="news-title">🚑 成功救援三隻受困幼貓，目前狀況穩定</p>
                </div>
                <div class="news-item">
                    <span class="news-date">2026-08-23</span>
                    <span class="news-tag">活動</span>
                    <p class="news-title">🎉 本週六舉辦「浪浪認養會」，歡迎大家來參與！</p>
                </div>
                <div class="news-item">
                    <span class="news-date">2026-08-22</span>
                    <span class="news-tag">捐款</span>
                    <p class="news-title">🙏 感謝各界善心人士，本月捐款已達目標！</p>
                </div>
            </div>
        </div>
    </section>

    <!-- ===== 頁尾 ===== -->
    <footer class="footer">
        <p>&copy; 2026 浪愛串聯 · 用愛終止流浪</p>
    </footer>

</body>
</html>
